[package]
name = "shared"
version = "0.1.0"
edition = "2021"
description = "Common utilities for skidmarks"
repository = "https://github.com/kennethlove/skidmarks"
readme = "README.md"
license = "Apache-2.0"
keywords = ["streaks", "habits"]
categories = ["command-line-utilities"]

[dependencies]
ansi_term = "0.12.1"
assert_fs = "1.1.2"
catppuccin = { version = "2.4.0", features = ["ansi-term", "css-colors", "ratatui"] }
clap = { version = "4.5.22", features = ["derive"] }
ratatui = "0.29.0"
ron = "0.8.1"
serde = { version = "1.0.204", features = ["derive"] }
uuid = { version = "1.11.0", features = ["serde", "v4", "fast-rng"] }
dirs = "5.0.1"
streak = { path = "../streak" }

[dependencies.crossterm]
version = "0.28.1"